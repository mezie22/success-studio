<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Success Studio - Project 1</title>

    <style>

        .project-preview {
            display: block;
            width: 100%;
            max-width: 700px;
            height: auto;
            display: block;
            margin: 25px auto;
            border: 2px solid #D4AF37;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }
      
        body {
            background-color: #fafafa;
            font-family: Arial;
            color: #333;
            text-align: center;
            padding: 30px;
            max-width: 800px;
            margin: auto;
            border: 2px solid #D4AF37;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #D4AF37;
            font-size: 40px;
            margin-bottom: 20px;
            margin-top: 40px;
        }

        h2 {
            color: #D4AF37;
            font-size: 28px;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #555;
            max-width: 600px;
            margin: 15px auto;
        }

        /* Image */
        #projectImage {
            width: 100%;
            max-width: 420px;
            height: auto;
            border-radius: 12px;
            border: 2px solid #D4AF37;
            margin: 25px auto;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        /* Upload button */
        .upload-label {
            display: inline-block;
            background-color: #D4AF37;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .upload-label:hover {
            background-color: black;
            transform: translateY(-2px);
        }

        #imageInput {
            display: none;
        }

        button {
            background-color: #D4AF37;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 20px;
        }

        button:hover {
            background-color: black;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 15px;
            }

            h1 {
                font-size: 30px;
                margin-top: 20px;
            }

            h2 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }

            #projectImage {
                width: 100%;
            }

            button,
            .upload-label {
                width: 90%;
                max-width: 250px;
            }
        }
    </style>
</head>

<body>

    <h1>Success Studio Website</h1>

    <img src="homepage-preview.png" alt="Success Studio Homepage Preview" class="project-preview">

    <img src="project2-preview.png" alt="Second Success Studio Project Preview" class="project-preview">
    <h2>Project Details</h2>

    <p>
        This project was created to practice building a clean,
        professional website using HTML and CSS.
    </p>

    <p>
        This is one of my web design projects.
    </p>

    <p>
        Built with HTML and CSS.
    </p>

    <a href="index.html">
        <button>Back to Success Studio</button>
    </a>


</body>
</html>
